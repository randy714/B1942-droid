name: Build B1942-droid Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Create Keystore & Sign Release APK
        run: |
          # 1. Membuat Keystore Digital Otomatis
          keytool -genkey -v -keystore release.keystore -alias b1942key -keyalg RSA -keysize 2048 -validity 10000 -storepass b1942pass -keypass b1942pass -dname "CN=B1942Droid, OU=MobileEngine, O=B1942, L=ID, ST=ID, C=ID"

          # 2. Cari Lokasi Build Tools Android SDK
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          # 3. ZipAlign & Sign APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/B1942-droid-v2.5-Release.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:b1942pass --key-pass pass:b1942pass app/build/outputs/apk/release/B1942-droid-v2.5-Release.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B1942-droid-v2.5-Release-APK
          path: app/build/outputs/apk/release/B1942-droid-v2.5-Release.apk
