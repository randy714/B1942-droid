name: Build and Publish B1942-droid Engine Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK and CMake via Pre-installed SDK Manager
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Standalone C++ Engine Release APK
        run: gradle assembleRelease --no-daemon

      - name: Align and Sign Artifact
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 "$APK_PATH" B1942-droid-v2.5.apk
          
          keytool -genkeypair -v -keystore release.keystore -alias b1942 -keyalg RSA -keysize 2048 -validity 10000 -storepass b1942pass -keypass b1942pass -dname "CN=B1942 Engine, OU=Tactical, O=B1942, L=ID, C=ID"
          
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-key-alias b1942 --ks-pass pass:b1942pass --key-pass pass:b1942pass B1942-droid-v2.5.apk

      - name: Create GitHub Release v2.5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5
          name: B1942-droid v2.5 Standalone Engine Release
          body_path: README.md
          files: B1942-droid-v2.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
